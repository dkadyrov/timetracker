<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logger">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Logger</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button id="menuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#9776;</button>

<div id="menuPanel" role="menu">
  <button id="undoBtn" role="menuitem">Undo Last</button>
  <button id="shareBtn" role="menuitem">Share / Save CSV</button>
  <button id="clearBtn" class="danger" role="menuitem">Clear Log</button>
  <div class="menu-divider"></div>
  <button id="themeMenuBtn" role="menuitem" aria-haspopup="true" aria-expanded="false">
    <span>Theme</span>
    <span class="menu-item-value"><span id="themeMenuValue">Dark</span> &#8250;</span>
  </button>
</div>

<div id="themePanel" role="menu">
  <button class="theme-option" data-theme-value="light" role="menuitem">Light</button>
  <button class="theme-option" data-theme-value="dark" role="menuitem">Dark</button>
  <button class="theme-option" data-theme-value="alex" role="menuitem">Alex Theme</button>
</div>

<main>
  <h1 id="appTitle" class="app-title"></h1>

  <div id="controls"></div>

  <div id="grid"></div>

  <div id="logbar">
    <div class="logbar-head">
      <h2>Log</h2>
      <div class="logbar-tools">
        <div class="entry-count">0 entries</div>
        <button id="logExpandBtn" aria-label="Expand log" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        </button>
      </div>
    </div>
    <div id="entries"></div>
  </div>
</main>

<div id="toast"></div>

<div id="logOverlay">
  <div id="logOverlayCard">
    <div class="logbar-head">
      <h2>Log</h2>
      <div class="logbar-tools">
        <div class="entry-count">0 entries</div>
        <button id="logCollapseBtn" aria-label="Collapse log">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        </button>
      </div>
    </div>
    <div id="entriesDock"></div>
  </div>
</div>

<div id="modalOverlay">
  <div id="modalCard">
    <h3>Custom entry</h3>
    <textarea id="modalInput" rows="3" placeholder="Type anything…" maxlength="200"></textarea>
    <div id="modalActions">
      <button id="modalCancel">Cancel</button>
      <button id="modalSubmit">Log Entry</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ENTRIES_KEY = "log_entries_v3";
  var WIDGETS_KEY = "log_widgets_v1";

  var entries = [];
  var widgetState = {};
  var widgetsConfig = [];
  var editingIndex = -1;

  var appTitleEl = document.getElementById("appTitle");
  var controlsEl = document.getElementById("controls");
  var gridEl = document.getElementById("grid");
  var entriesEl = document.getElementById("entries");
  var entryCountEls = document.querySelectorAll(".entry-count");
  var entriesHome = entriesEl.parentNode;
  var logOverlay = document.getElementById("logOverlay");
  var entriesDock = document.getElementById("entriesDock");
  var logExpandBtn = document.getElementById("logExpandBtn");
  var logCollapseBtn = document.getElementById("logCollapseBtn");
  var toastEl = document.getElementById("toast");

  var modalOverlay = document.getElementById("modalOverlay");
  var modalInput = document.getElementById("modalInput");

  /* ---------- persistence ---------- */
  function loadEntries(){
    try{
      var raw = localStorage.getItem(ENTRIES_KEY);
      entries = raw ? JSON.parse(raw) : [];
    }catch(e){ entries = []; }
  }
  function saveEntries(){
    try{ localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); }catch(e){}
  }
  function loadWidgetState(){
    try{
      var raw = localStorage.getItem(WIDGETS_KEY);
      widgetState = raw ? JSON.parse(raw) : {};
    }catch(e){ widgetState = {}; }
  }
  function saveWidgetState(){
    try{ localStorage.setItem(WIDGETS_KEY, JSON.stringify(widgetState)); }catch(e){}
  }

  /* ---------- CSV ---------- */
  function csvEscape(val){
    var s = String(val);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function toCSV(){
    var widgetKeys = widgetsConfig.map(function(w){ return w.key; });
    var lines = [["timestamp","button"].concat(widgetKeys).map(csvEscape).join(",")];
    entries.forEach(function(e){
      var row = [e.ts, e.ctx].concat(widgetKeys.map(function(k){
        var v = e.widgets && e.widgets[k];
        return v === undefined ? "" : v;
      }));
      lines.push(row.map(csvEscape).join(","));
    });
    return lines.join("\n") + "\n";
  }

  function fmtDisplayTime(iso){
    var d = new Date(iso);
    return d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }

  /* ---------- rendering ---------- */
  var EDIT_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>';
  var DELETE_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';

  function renderEntries(opts){
    var preserveScroll = opts && opts.preserveScroll;
    var prevScrollTop = preserveScroll ? entriesEl.scrollTop : null;

    var countText = entries.length + (entries.length === 1 ? " entry" : " entries");
    entryCountEls.forEach(function(el){ el.textContent = countText; });
    if (entries.length === 0){
      editingIndex = -1;
      entriesEl.innerHTML = '<div class="empty-state">No entries yet — tap a button above to log a timestamp.</div>';
      return;
    }
    var expanded = (entriesEl.parentNode === entriesDock);
    var html = "";
    entries.forEach(function(e, idx){
      if (idx === editingIndex){
        html += '<div class="entry entry-editing" data-index="' + idx + '">' +
                  '<input type="text" class="entry-edit-input" value="' + escapeHtml(e.ctx) + '" maxlength="200">' +
                '</div>';
        return;
      }
      var subParts = [];
      widgetsConfig.forEach(function(w){
        var v = e.widgets && e.widgets[w.key];
        if (w.type === "toggle"){
          if (v) subParts.push(w.title || w.key);
          return;
        }
        if (v === undefined || v === "" || v === null) return;
        var isStepperLike = (w.type === "stepper" || w.type === "alphaStepper");
        subParts.push(isStepperLike ? (w.title || w.key) + " " + v : v);
      });
      if (expanded) subParts.push(fmtDisplayTime(e.ts));

      html += '<div class="entry" data-index="' + idx + '">' +
                '<div class="meta">' +
                  '<span class="ctx">' + escapeHtml(e.ctx) + '</span>' +
                  '<span class="sub">' + escapeHtml(subParts.join(" · ")) + '</span>' +
                '</div>';
      if (expanded){
        html += '<div class="entry-actions">' +
                  '<button type="button" class="entry-edit" aria-label="Edit entry">' + EDIT_ICON + '</button>' +
                  '<button type="button" class="entry-delete" aria-label="Delete entry">' + DELETE_ICON + '</button>' +
                '</div>';
      } else {
        html += '<span class="ts">' + fmtDisplayTime(e.ts) + '</span>';
      }
      html += '</div>';
    });
    entriesEl.innerHTML = html;

    if (preserveScroll){
      entriesEl.scrollTop = prevScrollTop;
    } else {
      entriesEl.scrollTop = entriesEl.scrollHeight;
    }

    if (editingIndex !== -1){
      var input = entriesEl.querySelector(".entry-edit-input");
      if (input){ input.focus(); input.select(); }
    }
  }

  function commitEdit(input){
    var idx = editingIndex;
    if (idx === -1) return;
    editingIndex = -1;
    var text = input.value.trim();
    if (text && entries[idx]){
      entries[idx].ctx = text;
      saveEntries();
    }
    renderEntries({preserveScroll:true});
  }

  entriesEl.addEventListener("click", function(e){
    var editBtn = e.target.closest(".entry-edit");
    var delBtn = e.target.closest(".entry-delete");
    if (editBtn){
      var editEntry = editBtn.closest(".entry");
      editingIndex = parseInt(editEntry.dataset.index, 10);
      renderEntries({preserveScroll:true});
      return;
    }
    if (delBtn){
      var delEntry = delBtn.closest(".entry");
      var idx = parseInt(delEntry.dataset.index, 10);
      if (confirm("Delete this entry?")){
        entries.splice(idx, 1);
        saveEntries();
        if (editingIndex === idx) editingIndex = -1;
        renderEntries({preserveScroll:true});
        showToast("Entry deleted");
      }
    }
  });
  entriesEl.addEventListener("keydown", function(e){
    if (!e.target.classList.contains("entry-edit-input")) return;
    if (e.key === "Enter"){
      e.preventDefault();
      e.target.blur();
    } else if (e.key === "Escape"){
      e.preventDefault();
      editingIndex = -1;
      renderEntries({preserveScroll:true});
    }
  });
  entriesEl.addEventListener("focusout", function(e){
    if (!e.target.classList.contains("entry-edit-input")) return;
    commitEdit(e.target);
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  /* ---------- widgets (stepper / alphaStepper / select / toggle / text) ---------- */
  function initWidgetDefaults(widgets){
    widgets.forEach(function(w){
      if (widgetState[w.key] !== undefined) return;
      if (w.type === "stepper") widgetState[w.key] = (w.start !== undefined ? w.start : 1);
      else if (w.type === "alphaStepper") widgetState[w.key] = (w.start !== undefined ? String(w.start).toUpperCase() : "A");
      else if (w.type === "toggle") widgetState[w.key] = !!w.default;
      else widgetState[w.key] = "";
    });
  }

  function buildStepperWidget(tile, w){
    var wrap = document.createElement("div");
    wrap.className = "stepper";

    var dec = document.createElement("button");
    dec.type = "button";
    dec.textContent = "–";
    dec.setAttribute("aria-label", "Decrease " + (w.title || w.key));

    var val = document.createElement("div");
    val.className = "stepper-value";

    var inc = document.createElement("button");
    inc.type = "button";
    inc.textContent = "+";
    inc.setAttribute("aria-label", "Increase " + (w.title || w.key));

    function render(){ val.textContent = widgetState[w.key]; }

    var step = w.step || 1;
    dec.addEventListener("click", function(){
      var min = (w.min !== undefined) ? w.min : 0;
      widgetState[w.key] = Math.max(min, (widgetState[w.key] || 0) - step);
      saveWidgetState();
      render();
    });
    inc.addEventListener("click", function(){
      var next = (widgetState[w.key] || 0) + step;
      if (w.max !== undefined) next = Math.min(w.max, next);
      widgetState[w.key] = next;
      saveWidgetState();
      render();
    });

    wrap.appendChild(dec);
    wrap.appendChild(val);
    wrap.appendChild(inc);
    tile.appendChild(wrap);
    render();
  }

  function buildAlphaStepperWidget(tile, w){
    var wrap = document.createElement("div");
    wrap.className = "stepper";

    var dec = document.createElement("button");
    dec.type = "button";
    dec.textContent = "–";
    dec.setAttribute("aria-label", "Decrease " + (w.title || w.key));

    var val = document.createElement("div");
    val.className = "stepper-value";

    var inc = document.createElement("button");
    inc.type = "button";
    inc.textContent = "+";
    inc.setAttribute("aria-label", "Increase " + (w.title || w.key));

    var minChar = String(w.min || "A").toUpperCase().charCodeAt(0);
    var maxChar = String(w.max || "Z").toUpperCase().charCodeAt(0);

    function render(){ val.textContent = widgetState[w.key]; }

    dec.addEventListener("click", function(){
      var code = String(widgetState[w.key] || "A").toUpperCase().charCodeAt(0) - 1;
      widgetState[w.key] = String.fromCharCode(Math.max(minChar, code));
      saveWidgetState();
      render();
    });
    inc.addEventListener("click", function(){
      var code = String(widgetState[w.key] || "A").toUpperCase().charCodeAt(0) + 1;
      widgetState[w.key] = String.fromCharCode(Math.min(maxChar, code));
      saveWidgetState();
      render();
    });

    wrap.appendChild(dec);
    wrap.appendChild(val);
    wrap.appendChild(inc);
    tile.appendChild(wrap);
    render();
  }

  function buildSelectWidget(tile, w){
    var selectEl = document.createElement("select");
    var placeholderOpt = document.createElement("option");
    placeholderOpt.value = "";
    placeholderOpt.disabled = true;
    placeholderOpt.textContent = w.placeholder || "Select…";
    selectEl.appendChild(placeholderOpt);
    (w.options || []).forEach(function(opt){
      var o = document.createElement("option");
      o.value = opt;
      o.textContent = opt;
      selectEl.appendChild(o);
    });

    var doLock = w.lock !== false;
    var lockWrap, lockName, changeBtn;
    if (doLock){
      lockWrap = document.createElement("div");
      lockWrap.className = "widget-locked hidden";
      lockName = document.createElement("span");
      lockName.className = "name";
      changeBtn = document.createElement("button");
      changeBtn.type = "button";
      changeBtn.textContent = "Change";
      lockWrap.appendChild(lockName);
      lockWrap.appendChild(changeBtn);
    }

    function render(){
      var value = widgetState[w.key] || "";
      if (doLock && value){
        selectEl.classList.add("hidden");
        lockWrap.classList.remove("hidden");
        lockName.textContent = value;
      } else {
        selectEl.classList.remove("hidden");
        if (lockWrap) lockWrap.classList.add("hidden");
        selectEl.value = value;
      }
    }

    selectEl.addEventListener("change", function(){
      if (!selectEl.value) return;
      widgetState[w.key] = selectEl.value;
      saveWidgetState();
      render();
      showToast((w.title || w.key) + " set: " + selectEl.value);
    });
    if (changeBtn){
      changeBtn.addEventListener("click", function(){
        widgetState[w.key] = "";
        saveWidgetState();
        render();
      });
    }

    tile.appendChild(selectEl);
    if (lockWrap) tile.appendChild(lockWrap);
    render();
  }

  function buildToggleWidget(tile, w){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "toggle-btn";

    function render(){
      var on = !!widgetState[w.key];
      btn.classList.toggle("on", on);
      btn.textContent = on ? (w.onLabel || "On") : (w.offLabel || "Off");
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    }
    btn.addEventListener("click", function(){
      widgetState[w.key] = !widgetState[w.key];
      saveWidgetState();
      render();
    });

    tile.appendChild(btn);
    render();
  }

  function buildTextWidget(tile, w){
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = w.placeholder || "";
    if (w.maxlength) input.maxLength = w.maxlength;
    input.value = widgetState[w.key] || "";

    input.addEventListener("input", function(){
      widgetState[w.key] = input.value;
      saveWidgetState();
    });

    tile.appendChild(input);
  }

  function buildControls(widgets){
    controlsEl.innerHTML = "";
    widgets.forEach(function(w){
      var tile = document.createElement("div");
      tile.className = "control-tile";
      tile.dataset.key = w.key;

      var caption = document.createElement("div");
      caption.className = "caption";
      caption.textContent = w.title || w.key;
      tile.appendChild(caption);

      if (w.type === "stepper") buildStepperWidget(tile, w);
      else if (w.type === "alphaStepper") buildAlphaStepperWidget(tile, w);
      else if (w.type === "select") buildSelectWidget(tile, w);
      else if (w.type === "toggle") buildToggleWidget(tile, w);
      else if (w.type === "text") buildTextWidget(tile, w);

      controlsEl.appendChild(tile);
    });
  }

  /* ---------- logging ---------- */
  function logEntry(context, tileEl){
    var ts = new Date().toISOString();
    entries.push({ ts: ts, ctx: context, widgets: Object.assign({}, widgetState) });
    saveEntries();
    renderEntries();
    if (tileEl){
      tileEl.classList.add("flash");
      setTimeout(function(){ tileEl.classList.remove("flash"); }, 180);
    }
    if (navigator.vibrate) { try{ navigator.vibrate(15); }catch(e){} }
    showToast("Logged: " + context);
  }

  /* ---------- custom text modal ---------- */
  function openModal(){
    modalInput.value = "";
    modalOverlay.classList.add("show");
    setTimeout(function(){ modalInput.focus(); }, 50);
  }
  function closeModal(){
    modalOverlay.classList.remove("show");
  }
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalSubmit").addEventListener("click", function(){
    var text = modalInput.value.trim();
    if (!text){
      showToast("Type something first");
      return;
    }
    logEntry(text);
    closeModal();
  });
  modalOverlay.addEventListener("click", function(e){
    if (e.target === modalOverlay) closeModal();
  });

  /* ---------- build grid + widgets from config ---------- */
  function buildGrid(config){
    document.title = config.appName || "Logger";
    appTitleEl.textContent = config.appName || "";
    appTitleEl.classList.toggle("hidden", !config.appName);
    gridEl.innerHTML = "";

    (config.buttons || []).forEach(function(btn){
      var el = document.createElement("button");
      el.className = "tile";
      el.style.setProperty("--tile-color", btn.color || "#3498db");
      el.textContent = btn.label;
      el.addEventListener("click", function(){
        logEntry(btn.context || btn.label, el);
      });
      gridEl.appendChild(el);
    });

    // Custom text tile — always added last
    var customEl = document.createElement("button");
    customEl.className = "tile";
    customEl.style.setProperty("--tile-color", config.customButtonColor || "#546e7a");
    customEl.textContent = config.customButtonLabel || "Custom…";
    customEl.addEventListener("click", openModal);
    gridEl.appendChild(customEl);

    widgetsConfig = config.widgets || [];
    initWidgetDefaults(widgetsConfig);
    buildControls(widgetsConfig);
    renderEntries();
  }

  function loadConfig(){
    fetch("config.json", {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(config){ buildGrid(config); })
      .catch(function(){
        buildGrid({
          appName:"Logger",
          buttons:[
            // {label:"Takeoff", context:"Takeoff", color:"#3498db"},
            // {label:"Landing", context:"Landing", color:"#e67e22"}
          ],
          widgets:[]
        });
        showToast("Using default buttons (config.json not found)");
      });
  }

  /* ---------- share / export ---------- */
  function isMobileOrTablet(){
    var ua = navigator.userAgent || navigator.vendor || "";
    if (/android|iphone|ipad|ipod/i.test(ua)) return true;
    // iPadOS 13+ reports as "Macintosh" but exposes touch support
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;
    return false;
  }

  async function shareOrDownload(){
    if (entries.length === 0){
      showToast("Nothing to export yet");
      return;
    }
    var csv = toCSV();
    var fileName = "log_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".csv";
    var file;
    try{
      file = new File([csv], fileName, {type:"text/csv"});
    }catch(e){
      file = null;
    }

    if (isMobileOrTablet() && navigator.canShare && file && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title: fileName,
          text: "Log export"
        });
        return;
      }catch(err){
        if (err && err.name === "AbortError") return;
      }
    }

    var blob = new Blob([csv], {type:"text/csv"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showToast("CSV downloaded");
  }

  /* ---------- log expand/collapse (hover window) ---------- */
  function openLog(){
    entriesDock.appendChild(entriesEl);
    renderEntries();
    logOverlay.classList.add("show");
    logExpandBtn.setAttribute("aria-expanded", "true");
  }
  function closeLog(){
    if (editingIndex !== -1){
      var input = entriesEl.querySelector(".entry-edit-input");
      if (input) commitEdit(input);
    }
    entriesHome.appendChild(entriesEl);
    renderEntries();
    logOverlay.classList.remove("show");
    logExpandBtn.setAttribute("aria-expanded", "false");
  }
  logExpandBtn.addEventListener("click", openLog);
  logCollapseBtn.addEventListener("click", closeLog);
  logOverlay.addEventListener("click", function(e){
    if (e.target === logOverlay) closeLog();
  });

  /* ---------- hamburger menu ---------- */
  var menuBtn = document.getElementById("menuBtn");
  var menuPanel = document.getElementById("menuPanel");
  function openMenu(){
    menuPanel.classList.add("show");
    menuBtn.setAttribute("aria-expanded", "true");
  }
  function closeMenu(){
    menuPanel.classList.remove("show");
    menuBtn.setAttribute("aria-expanded", "false");
  }
  menuBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if (menuPanel.classList.contains("show")) closeMenu(); else openMenu();
  });
  document.addEventListener("click", function(e){
    if (menuPanel.classList.contains("show") && !menuPanel.contains(e.target) && e.target !== menuBtn){
      closeMenu();
    }
    if (themePanel.classList.contains("show") && !themePanel.contains(e.target) && e.target !== menuBtn){
      closeThemePanel();
    }
  });

  document.getElementById("undoBtn").addEventListener("click", function(){
    closeMenu();
    if (entries.length === 0) return;
    var removed = entries.pop();
    saveEntries();
    renderEntries();
    showToast("Removed: " + removed.ctx);
  });

  document.getElementById("shareBtn").addEventListener("click", function(){
    closeMenu();
    shareOrDownload();
  });

  document.getElementById("clearBtn").addEventListener("click", function(){
    closeMenu();
    if (entries.length === 0) return;
    if (confirm("Clear all " + entries.length + " logged entries? This cannot be undone.")){
      entries = [];
      saveEntries();
      renderEntries();
      showToast("Log cleared");
    }
  });

  /* ---------- theme ---------- */
  var THEME_KEY = "log_theme_v1";
  var THEME_ORDER = ["light", "dark", "alex"];
  var THEME_META_COLOR = { dark:"#000000", light:"#ffffff", alex:"#000000" };
  var THEME_LABEL = { dark:"Dark", light:"Light", alex:"Alex Theme" };
  var themeMetaEl = document.querySelector('meta[name="theme-color"]');
  var themeMenuBtn = document.getElementById("themeMenuBtn");
  var themeMenuValueEl = document.getElementById("themeMenuValue");
  var themePanel = document.getElementById("themePanel");
  var themeOptionBtns = document.querySelectorAll(".theme-option");
  var currentTheme;

  function loadTheme(){
    var saved;
    try{ saved = localStorage.getItem(THEME_KEY); }catch(e){ saved = null; }
    if (THEME_ORDER.indexOf(saved) !== -1) return saved;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    themeMetaEl.setAttribute("content", THEME_META_COLOR[theme]);
    themeMenuValueEl.textContent = THEME_LABEL[theme];
    themeOptionBtns.forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.themeValue === theme);
    });
  }
  currentTheme = loadTheme();
  applyTheme(currentTheme);

  function openThemePanel(){
    themePanel.classList.add("show");
    themeMenuBtn.setAttribute("aria-expanded", "true");
  }
  function closeThemePanel(){
    themePanel.classList.remove("show");
    themeMenuBtn.setAttribute("aria-expanded", "false");
  }
  themeMenuBtn.addEventListener("click", function(e){
    e.stopPropagation();
    closeMenu();
    openThemePanel();
  });
  themeOptionBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      currentTheme = btn.dataset.themeValue;
      try{ localStorage.setItem(THEME_KEY, currentTheme); }catch(e){}
      applyTheme(currentTheme);
      closeThemePanel();
    });
  });

  loadEntries();
  loadWidgetState();
  renderEntries();
  loadConfig();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
