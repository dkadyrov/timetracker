<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flight Log">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Flight Log</title>
<style>
  :root{
    --bg:#0b0d12;
    --panel:#151822;
    --panel-2:#1c2030;
    --text:#f4f5f7;
    --muted:#8b93a7;
    --accent:#5b8cff;
    --danger:#e74c3c;
    --radius:22px;
    --gap: clamp(10px, 2vw, 16px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation;}
  html,body{
    height:100dvh;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    user-select:none;
    touch-action: manipulation;
  }
  body{
    display:flex;
    flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    height:100dvh;
  }
  header{
    padding: 14px 18px 4px 18px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    font-size: clamp(18px, 3vw, 24px);
    margin:0;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  header .sub{
    color:var(--muted);
    font-size:13px;
    font-variant-numeric: tabular-nums;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 8px var(--gap) var(--gap) var(--gap);
    gap: var(--gap);
    min-height:0;
    overflow:hidden;
  }

  /* ---------- Control bar: Mission ID + Drone Model ---------- */
  #controls{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
  }
  .control-tile{
    background: var(--panel-2);
    border-radius: var(--radius);
    padding: 10px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    justify-content:center;
    min-height: 60px;
  }
  .control-tile .caption{
    font-size: clamp(11px, 1.6vw, 13px);
    font-weight:700;
    opacity:0.7;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  #missionStepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #missionStepper button{
    border:none;
    background: rgba(255,255,255,0.14);
    color:#fff;
    font-size:22px;
    font-weight:800;
    width:38px;
    height:38px;
    border-radius:10px;
    cursor:pointer;
    line-height:1;
    flex:none;
  }
  #missionStepper button:active{ filter:brightness(1.3); }
  #missionValue{
    flex:1;
    text-align:center;
    font-size: clamp(20px, 3vw, 26px);
    font-weight:800;
    font-variant-numeric: tabular-nums;
  }

  #droneTile select{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    border:none;
    border-radius:12px;
    background: rgba(255,255,255,0.18);
    color:#fff;
    font-size: clamp(16px, 2.2vw, 18px);
    font-weight:700;
    padding: 9px 12px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position: right 10px center;
    background-size: 18px;
  }
  #droneTile select:focus{ outline: 2px solid rgba(255,255,255,0.6); }

  #droneLocked{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background: rgba(255,255,255,0.1);
    border-radius:12px;
    padding: 9px 10px 9px 12px;
  }
  #droneLocked .name{
    font-size: clamp(15px, 2.2vw, 18px);
    font-weight:800;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #droneLocked button{
    border:none;
    background: rgba(255,255,255,0.16);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    padding:7px 10px;
    border-radius:9px;
    cursor:pointer;
    flex:none;
  }
  #droneLocked button:active{ filter:brightness(1.3); }
  .hidden{ display:none !important; }

  /* ---------- Button grid ---------- */
  #grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 1fr;
    gap: var(--gap);
    flex: 1 1 auto;
    min-height:0;
    overflow:hidden;
  }
  @media (min-width: 640px){
    #grid{ grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 1000px){
    #grid{ grid-template-columns: repeat(4, 1fr); }
  }
  .tile{
    border:none;
    border-radius: var(--radius);
    color:#fff;
    font-size: clamp(17px, 2.6vw, 24px);
    font-weight:800;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 10px 14px;
    min-height: 44px;
    cursor:pointer;
    position:relative;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 10px 18px rgba(0,0,0,0.28);
    transition: transform .06s ease, box-shadow .06s ease;
    -webkit-user-select:none;
  }
  .tile:active, .tile.flash{
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.28);
  }
  .tile.flash{ filter: brightness(1.25); }

  #logbar{
    background: var(--panel);
    border-radius: var(--radius);
    padding: 12px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    height: 26vh;
    flex: 0 0 26vh;
  }
  #logbar .logbar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #logbar h2{
    margin:0;
    font-size:14px;
    color:var(--muted);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  #entryCount{
    color:var(--muted);
    font-size:13px;
    font-variant-numeric: tabular-nums;
  }
  #entries{
    overflow-y:auto;
    display:flex;
    flex-direction:column-reverse;
    gap:6px;
    flex:1 1 auto;
    min-height:0;
    -webkit-overflow-scrolling: touch;
  }
  .entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background: var(--panel-2);
    border-radius:10px;
    padding:8px 10px;
    font-size:14px;
  }
  .entry .meta{ display:flex; flex-direction:column; min-width:0; }
  .entry .ctx{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry .sub{ color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry .ts{ color:var(--muted); font-variant-numeric: tabular-nums; font-size:12.5px; flex:none; }
  .empty-state{
    color:var(--muted);
    font-size:14px;
    text-align:center;
    padding:14px 0;
  }
  #actions{
    display:flex;
    gap: var(--gap);
  }
  .action-btn{
    flex:1;
    border:none;
    border-radius:16px;
    padding:14px 10px;
    font-size:15px;
    font-weight:700;
    color:#fff;
    background: var(--panel-2);
    cursor:pointer;
  }
  .action-btn.primary{ background: var(--accent); }
  .action-btn.danger{ background: transparent; color: var(--danger); border: 1px solid rgba(231,76,60,0.45); }
  .action-btn:active{ filter: brightness(1.15); }

  #toast{
    position:fixed;
    left:50%;
    bottom: calc(env(safe-area-inset-bottom) + 18px);
    transform: translateX(-50%) translateY(20px);
    background: #23283a;
    color:#fff;
    padding:10px 16px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index:50;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  /* ---------- Custom text modal ---------- */
  #modalOverlay{
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition: opacity .18s ease;
  }
  #modalOverlay.show{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){
    #modalOverlay{ align-items:center; }
  }
  #modalCard{
    background: var(--panel);
    width:100%;
    max-width:480px;
    border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px) 18px;
    transform: translateY(16px);
    transition: transform .18s ease;
  }
  #modalOverlay.show #modalCard{ transform: translateY(0); }
  @media (min-width:640px){
    #modalCard{ border-radius:22px; padding:18px; }
  }
  #modalCard h3{
    margin:0 0 12px 0;
    font-size:16px;
    font-weight:800;
  }
  #modalInput{
    width:100%;
    border:none;
    border-radius:12px;
    background: rgba(255,255,255,0.1);
    color:#fff;
    font-size:16px;
    padding:12px;
    font-family:inherit;
    resize:none;
  }
  #modalActions{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  #modalActions button{
    flex:1;
    border:none;
    border-radius:14px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
  }
  #modalCancel{ background: var(--panel-2); }
  #modalSubmit{ background: var(--accent); }
</style>
</head>
<body>

<header>
  <h1 id="appTitle">Flight Log</h1>
  <div class="sub" id="clock">--:--:--</div>
</header>

<main>
  <div id="controls">
    <div class="control-tile" id="missionTile">
      <div class="caption">Mission ID</div>
      <div id="missionStepper">
        <button id="missionDec" aria-label="Decrease mission ID">–</button>
        <div id="missionValue">1</div>
        <button id="missionInc" aria-label="Increase mission ID">+</button>
      </div>
    </div>

    <div class="control-tile" id="droneTile">
      <div class="caption">Drone Model</div>
      <select id="droneSelect">
        <option value="" disabled selected>Select model…</option>
      </select>
      <div id="droneLocked" class="hidden">
        <span class="name" id="droneLockedName"></span>
        <button id="droneChangeBtn">Change</button>
      </div>
    </div>
  </div>

  <div id="grid"></div>

  <div id="logbar">
    <div class="logbar-head">
      <h2>Log</h2>
      <div id="entryCount">0 entries</div>
    </div>
    <div id="entries"></div>
  </div>

  <div id="actions">
    <button class="action-btn" id="undoBtn">Undo Last</button>
    <button class="action-btn primary" id="shareBtn">Share / Save CSV</button>
    <button class="action-btn danger" id="clearBtn">Clear Log</button>
  </div>
</main>

<div id="toast"></div>

<div id="modalOverlay">
  <div id="modalCard">
    <h3>Custom entry</h3>
    <textarea id="modalInput" rows="3" placeholder="Type anything…" maxlength="200"></textarea>
    <div id="modalActions">
      <button id="modalCancel">Cancel</button>
      <button id="modalSubmit">Log Entry</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ENTRIES_KEY = "flightlog_entries_v2";
  var MISSION_KEY = "flightlog_mission_v1";
  var DRONE_KEY = "flightlog_drone_v1";

  var entries = [];
  var missionId = 1;
  var droneModel = "";

  var gridEl = document.getElementById("grid");
  var entriesEl = document.getElementById("entries");
  var entryCountEl = document.getElementById("entryCount");
  var toastEl = document.getElementById("toast");
  var clockEl = document.getElementById("clock");
  var missionValueEl = document.getElementById("missionValue");
  var droneSelectEl = document.getElementById("droneSelect");
  var droneLockedEl = document.getElementById("droneLocked");
  var droneLockedNameEl = document.getElementById("droneLockedName");

  var modalOverlay = document.getElementById("modalOverlay");
  var modalInput = document.getElementById("modalInput");

  /* ---------- persistence ---------- */
  function loadEntries(){
    try{
      var raw = localStorage.getItem(ENTRIES_KEY);
      entries = raw ? JSON.parse(raw) : [];
    }catch(e){ entries = []; }
  }
  function saveEntries(){
    try{ localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); }catch(e){}
  }
  function loadMission(){
    try{
      var raw = localStorage.getItem(MISSION_KEY);
      missionId = raw !== null ? parseInt(raw, 10) : 1;
      if (isNaN(missionId)) missionId = 1;
    }catch(e){ missionId = 1; }
  }
  function saveMission(){
    try{ localStorage.setItem(MISSION_KEY, String(missionId)); }catch(e){}
  }
  function loadDrone(){
    try{ droneModel = localStorage.getItem(DRONE_KEY) || ""; }catch(e){ droneModel = ""; }
  }
  function saveDrone(){
    try{ localStorage.setItem(DRONE_KEY, droneModel); }catch(e){}
  }

  /* ---------- CSV ---------- */
  function csvEscape(val){
    var s = String(val);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function toCSV(){
    var lines = ["timestamp,mission_id,drone_model,button"];
    entries.forEach(function(e){
      lines.push([
        csvEscape(e.ts),
        csvEscape(e.missionId),
        csvEscape(e.drone || ""),
        csvEscape(e.ctx)
      ].join(","));
    });
    return lines.join("\n") + "\n";
  }

  function fmtDisplayTime(iso){
    var d = new Date(iso);
    return d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }

  /* ---------- rendering ---------- */
  function renderEntries(){
    entryCountEl.textContent = entries.length + (entries.length === 1 ? " entry" : " entries");
    if (entries.length === 0){
      entriesEl.innerHTML = '<div class="empty-state">No entries yet — tap a button above to log a timestamp.</div>';
      return;
    }
    var html = "";
    entries.forEach(function(e){
      var subParts = ["Mission " + e.missionId];
      if (e.drone) subParts.push(e.drone);
      html += '<div class="entry">' +
                '<div class="meta">' +
                  '<span class="ctx">' + escapeHtml(e.ctx) + '</span>' +
                  '<span class="sub">' + escapeHtml(subParts.join(" · ")) + '</span>' +
                '</div>' +
                '<span class="ts">' + fmtDisplayTime(e.ts) + '</span>' +
              '</div>';
    });
    entriesEl.innerHTML = html;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  /* ---------- mission id stepper ---------- */
  function renderMission(){
    missionValueEl.textContent = missionId;
  }
  document.getElementById("missionInc").addEventListener("click", function(){
    missionId += 1;
    saveMission();
    renderMission();
  });
  document.getElementById("missionDec").addEventListener("click", function(){
    missionId = Math.max(0, missionId - 1);
    saveMission();
    renderMission();
  });

  /* ---------- drone model (locks once selected) ---------- */
  function renderDrone(){
    if (droneModel){
      droneSelectEl.classList.add("hidden");
      droneLockedEl.classList.remove("hidden");
      droneLockedNameEl.textContent = droneModel;
    } else {
      droneSelectEl.classList.remove("hidden");
      droneLockedEl.classList.add("hidden");
      droneSelectEl.value = "";
    }
  }
  droneSelectEl.addEventListener("change", function(){
    if (!droneSelectEl.value) return;
    droneModel = droneSelectEl.value;
    saveDrone();
    renderDrone();
    showToast("Drone set: " + droneModel);
  });
  document.getElementById("droneChangeBtn").addEventListener("click", function(){
    droneModel = "";
    saveDrone();
    renderDrone();
  });

  /* ---------- logging ---------- */
  function logEntry(context, tileEl){
    var ts = new Date().toISOString();
    entries.push({ ts: ts, missionId: missionId, drone: droneModel, ctx: context });
    saveEntries();
    renderEntries();
    if (tileEl){
      tileEl.classList.add("flash");
      setTimeout(function(){ tileEl.classList.remove("flash"); }, 180);
    }
    if (navigator.vibrate) { try{ navigator.vibrate(15); }catch(e){} }
    showToast("Logged: " + context);
  }

  /* ---------- custom text modal ---------- */
  function openModal(){
    modalInput.value = "";
    modalOverlay.classList.add("show");
    setTimeout(function(){ modalInput.focus(); }, 50);
  }
  function closeModal(){
    modalOverlay.classList.remove("show");
  }
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalSubmit").addEventListener("click", function(){
    var text = modalInput.value.trim();
    if (!text){
      showToast("Type something first");
      return;
    }
    logEntry(text);
    closeModal();
  });
  modalOverlay.addEventListener("click", function(e){
    if (e.target === modalOverlay) closeModal();
  });

  /* ---------- build grid from config ---------- */
  function buildGrid(config){
    document.getElementById("appTitle").textContent = config.appName || "Flight Log";
    document.title = config.appName || "Flight Log";
    gridEl.innerHTML = "";

    (config.buttons || []).forEach(function(btn){
      var el = document.createElement("button");
      el.className = "tile";
      el.style.background = btn.color || "#3498db";
      el.textContent = btn.label;
      el.addEventListener("click", function(){
        logEntry(btn.context || btn.label, el);
      });
      gridEl.appendChild(el);
    });

    // Custom text tile — always added last
    var customEl = document.createElement("button");
    customEl.className = "tile";
    customEl.style.background = config.customButtonColor || "#546e7a";
    customEl.textContent = config.customButtonLabel || "Custom…";
    customEl.addEventListener("click", openModal);
    gridEl.appendChild(customEl);

    // populate drone dropdown
    droneSelectEl.innerHTML = '<option value="" disabled selected>Select model…</option>';
    (config.droneModels || []).forEach(function(model){
      var opt = document.createElement("option");
      opt.value = model;
      opt.textContent = model;
      droneSelectEl.appendChild(opt);
    });
    renderDrone();
  }

  function loadConfig(){
    fetch("buttons.json", {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(config){ buildGrid(config); })
      .catch(function(){
        buildGrid({
          appName:"Flight Log",
          buttons:[
            {label:"Takeoff", context:"Takeoff", color:"#3498db"},
            {label:"Landing", context:"Landing", color:"#e67e22"}
          ],
          droneModels:["Default Drone"]
        });
        showToast("Using default buttons (buttons.json not found)");
      });
  }

  /* ---------- share / export ---------- */
  async function shareOrDownload(){
    if (entries.length === 0){
      showToast("Nothing to export yet");
      return;
    }
    var csv = toCSV();
    var fileName = "flightlog_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".csv";
    var file;
    try{
      file = new File([csv], fileName, {type:"text/csv"});
    }catch(e){
      file = null;
    }

    if (navigator.canShare && file && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title: fileName,
          text: "Flight log export"
        });
        return;
      }catch(err){
        if (err && err.name === "AbortError") return;
      }
    }

    var blob = new Blob([csv], {type:"text/csv"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showToast("CSV downloaded");
  }

  document.getElementById("shareBtn").addEventListener("click", shareOrDownload);

  document.getElementById("clearBtn").addEventListener("click", function(){
    if (entries.length === 0) return;
    if (confirm("Clear all " + entries.length + " logged entries? This cannot be undone.")){
      entries = [];
      saveEntries();
      renderEntries();
      showToast("Log cleared");
    }
  });

  document.getElementById("undoBtn").addEventListener("click", function(){
    if (entries.length === 0) return;
    var removed = entries.pop();
    saveEntries();
    renderEntries();
    showToast("Removed: " + removed.ctx);
  });

  function tickClock(){
    clockEl.textContent = new Date().toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  setInterval(tickClock, 1000);
  tickClock();

  loadEntries();
  loadMission();
  loadDrone();
  renderEntries();
  renderMission();
  loadConfig();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
